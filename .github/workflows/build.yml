name: Build EuroRig
on: [push, pull_request]
jobs:
  android:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install required Android build components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Verify Android build components
        run: python tools/verify_android_sdk.py "$ANDROID_HOME"
      - name: Configure local SDK
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
      - name: Install display compiler test dependency
        run: python -m pip install -r tools/test-requirements.txt
      - name: Verify routing, compiler and Android build
        run: |
          bash gradlew :routing:test :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
          python tools/run_tooling_tests.py
      - uses: actions/upload-artifact@v4
        with:
          name: EuroRig-development-${{ matrix.os }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            app/build/reports/lint-results-debug.xml
            routing/build/test-results/test/*.xml
